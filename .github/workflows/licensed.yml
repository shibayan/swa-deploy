# This workflow checks the statuses of cached dependencies used in this action
# with the help of the Licensed tool. If any licenses are invalid or missing,
# this workflow will fail. See: https://github.com/licensee/licensed

name: Licensed

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  licensed:
    name: Check Licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ruby

      # rugged links libgit2 against OpenSSL, whose pkg-config file on Ubuntu
      # 26.04 requires the static jitterentropy library.
      - name: Install Native Dependencies
        id: apt-install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjitterentropy3-dev

      - name: Setup Licensed
        id: setup-licensed
        uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
        with:
          version: 4.x
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # If installing Licensed fails, show the native extension build logs.
      - if: ${{ failure() && steps.setup-licensed.outcome == 'failure' }}
        name: Dump Native Extension Logs
        id: dump-logs
        run: |
          mkdir -p "$RUNNER_TEMP/gem-logs"
          gemdir="$(gem env gemdir)"
          find "$gemdir/extensions" -name mkmf.log -o -name gem_make.out | while read -r f; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
            cp --parents "$f" "$RUNNER_TEMP/gem-logs/"
          done
          gcc --version; cmake --version; pkg-config --version
          find "$gemdir/gems" -path '*rugged-*/vendor/libgit2/build/libgit2.pc' -exec cat {} \;

      - if: ${{ failure() && steps.setup-licensed.outcome == 'failure' }}
        name: Upload Native Extension Logs
        id: upload-logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-logs
          path: ${{ runner.temp }}/gem-logs

      # If this is a workflow_dispatch event, update the cached licenses.
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Update Licenses
        id: update-licenses
        run: licensed cache

      # Then, commit the updated licenses to the repository.
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Commit Licenses
        id: commit-licenses
        run: |
          git config --local user.email "licensed-ci@users.noreply.github.com"
          git config --local user.name "licensed-ci"
          git add .
          if git diff --staged --quiet; then
            echo "No license changes to commit."
          else
            git commit -m "Auto-update license files"
            git push
          fi

      # Last, check the status of the cached licenses.
      - name: Check Licenses
        id: check-licenses
        run: licensed status
